MsgEnableEncryptionTitle=Włącz szyfrowanie lokalne
MsgEnableEncryptionText=Po włączeniu tej opcji plik reminders.json zostanie zaszyfrowany za pomocą klucza konta systemu Windows (DPAPI):\n\n  • w edytorach tekstu (np. Notatniku) jego zawartość będzie nieczytelna.\n  • tylko Wise Reminder uruchomiony na tym koncie systemu Windows będzie mógł odszyfrować ten plik.\n\nWażne: klucz szyfrowania jest powiązany z tym komputerem i tym kontem Windows.\nPo ponownej instalacji systemu Windows, przywróceniu ustawień komputera lub przeniesieniu pliku na inny komputer,\nodszyfrowanie pliku stanie się niemożliwe.\n(sama ponowna instalacja Wise Reminder nie wpływa na dostęp do danych)\n\nPrzed zmianą urządzenia użyj funkcji "Eksportuj", aby utworzyć kopię zapasową zadań w pliku .wrm.\n\nWłączyć szyfrowanie lokalne?
MsgDPAPIUnavailable=DPAPI (Data Protection API) jest niedostępne w tym środowisku. Szyfrowanie nie zostało włączone.
